worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_tailscale_user_login $allow_reader {
        default 0;
        include /etc/excalidraw/reader.map;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        sub_filter_once off;
        sub_filter_types text/css;
        sub_filter 'https://excalidraw.nyc3.cdn.digitaloceanspaces.com/oss/' '/';
        sub_filter 'document.body.appendChild(scriptEle);' '';
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'" always;

        if ($allow_reader = 0) { return 403; }

        location ^~ /fonts/Assistant/ {
            try_files $uri /Assistant-Regular.woff2 =404;
        }
        location ~ "^/diagrams/[0-9a-f]{32}/scene\.excalidraw$" {
            default_type application/json;
            try_files $uri =404;
        }
        location ~ "^/diagrams/[0-9a-f]{32}/preview\.png$" {
            try_files $uri =404;
        }
        location /diagrams/ { return 404; }
        location / { try_files $uri $uri/ =404; }
    }
}
