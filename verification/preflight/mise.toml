min_version = "2026.10.24"

[env]
CARGO_INCREMENTAL = "0"

[tools]
rust = { version = "1.99.1", components = ["clippy", "rustfmt"] }
just = "1.59.0"

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:dbus-user-session" = "latest"
"apt:libpam-systemd" = "latest"
"apt:pkg-config" = "latest"
"apt:sudo" = "latest"

# The device image pulls this target through Tailscale enrollment.
# The isolated machine has no Tailscale state or enrollment service.
[bootstrap.directories."/etc/systemd/system/multi-user.target.d"]
mode = "0755"

[bootstrap.files."/etc/systemd/system/multi-user.target.d/network-online.conf"]
content = "[Unit]\nWants=network-online.target\n"
mode = "0644"
