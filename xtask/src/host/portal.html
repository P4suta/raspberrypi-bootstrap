<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pi services</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #000;
      background: #fff;
      font: 1.125rem/1.75 Inter, system-ui, sans-serif;
    }
    main {
      max-inline-size: 38rem;
      margin-inline: auto;
      padding: clamp(2.5rem, 10vh, 7rem) clamp(1rem, 5vw, 2.5rem);
    }
    h1 {
      margin: 0;
      overflow-wrap: anywhere;
      padding-block-end: 0.5em;
      border-block-end: 0.2rem solid;
      font-size: clamp(2.5rem, 8vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }
    a {
      display: flex;
      align-items: baseline;
      gap: 0.8em;
      min-block-size: 3rem;
      padding: 0.8em 0.4em;
      border-block-end: 1px solid;
      color: inherit;
      text-decoration: none;
    }
    a span:last-child {
      min-inline-size: 0;
      overflow-wrap: anywhere;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }
    a:hover span:last-child { text-decoration-thickness: 0.15em; }
    a:focus-visible { outline: 3px solid; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Pi services</h1>
    <!-- service links -->
  </main>
</body>
</html>
