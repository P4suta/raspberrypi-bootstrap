[package]
name = "raspberrypi-maintenance"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[example]]
name = "humidity_rehearsal"
test = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.100"
bcrypt = "0.19.3"
getrandom = "0.4.0"
reqwest = { version = "0.13.0", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls-native-roots",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zbus = { version = "6.5", default-features = false, features = [
  "service",
  "tokio",
] }
